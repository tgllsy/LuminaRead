<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅境 (LuminaRead) - 全端高保真重构原型系统</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#1b88ee',
              600: '#136ec2',
              700: '#0f5497',
            },
            paper: {
              white: '#ffffff',
              warm: '#fbf0d9',
              green: '#cce8cf',
              sepia: '#f5ebd7',
              dark: '#1c1d22',
              oled: '#0a0a0c',
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', '"Source Han Serif SC"', 'SimSun', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          boxShadow: {
            'book': '0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1)',
            'book-hover': '0 20px 35px -5px rgba(27, 136, 238, 0.25), 0 10px 15px -5px rgba(0, 0, 0, 0.1)',
            'floating': '0 20px 40px -10px rgba(15, 23, 42, 0.15)',
            'subtle': '0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.04)',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.7); }
    
    /* Device frames */
    .mobile-frame {
      width: 393px;
      height: 852px;
      border-radius: 48px;
      box-shadow: 0 0 0 12px #1e293b, 0 0 0 14px #334155, 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      background: #ffffff;
      flex-shrink: 0;
      transform: translate3d(0, 0, 0); /* 强制锁定子元素包含块 */
      isolation: isolate;
    }
    .mobile-island {
      width: 120px;
      height: 30px;
      background: #000000;
      border-radius: 20px;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }
    .desktop-frame {
      width: 100%;
      max-width: 1240px;
      height: 840px;
      border-radius: 16px;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      transform: translate3d(0, 0, 0); /* 强制锁定子元素包含块 */
      isolation: isolate;
    }
    
    /* Book spine 3D effect */
    .book-cover-3d {
      position: relative;
      transform-style: preserve-3d;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .book-cover-3d:hover {
      transform: translateY(-6px) scale(1.02);
    }
    .book-cover-3d::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(0,0,0,0.15) 60%, rgba(0,0,0,0.4) 100%);
      z-index: 10;
      border-radius: 4px 0 0 4px;
    }
    
    /* Realistic book page texture */
    .page-sepia {
      background-color: #f7f1e3;
      background-image: radial-gradient(#ece1cb 1px, transparent 0);
      background-size: 24px 24px;
    }
    .page-warm {
      background-color: #faf6ed;
    }
    
    /* Animation utilities */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .pulse-glow {
      animation: pulseGlow 3s infinite ease-in-out;
    }

    /* 2026 Next-Gen Realistic Book Gutter Spine Shadow */
    .book-spine-gutter {
      position: relative;
    }
    .book-spine-gutter::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 42px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, 
        rgba(0, 0, 0, 0) 0%, 
        rgba(92, 64, 40, 0.03) 25%, 
        rgba(60, 40, 20, 0.10) 50%, 
        rgba(92, 64, 40, 0.03) 75%, 
        rgba(0, 0, 0, 0) 100%
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Edge Page Turn Invisible Hover Zones */
    .page-flip-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 68px;
      z-index: 25;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .page-flip-zone.left {
      left: 0;
    }
    .page-flip-zone.left:hover {
      opacity: 1;
      background: linear-gradient(90deg, rgba(120, 90, 60, 0.07), transparent);
    }
    .page-flip-zone.right {
      right: 0;
    }
    .page-flip-zone.right:hover {
      opacity: 1;
      background: linear-gradient(270deg, rgba(120, 90, 60, 0.07), transparent);
    }

    /* 2026 Ghost Ambient Margin Note */
    .ghost-margin-note {
      position: absolute;
      right: -250px;
      width: 230px;
      opacity: 0.82;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ghost-margin-note:hover {
      opacity: 1;
      transform: translateX(-8px) scale(1.02);
      box-shadow: 0 16px 32px -8px rgba(30, 20, 10, 0.12);
    }

    /* Floating Micro HUD Island (Non-blocking reader control) */
    .floating-hud-island {
      animation: floatSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes floatSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <!-- ==================== PAGE TEMPLATES SCRIPT ==================== -->
  <script>
    // Current Active States
    let currentPage = 'shelf';
    let currentViewMode = 'split'; // 'split' | 'desktop' | 'mobile'

    // Device View Mode Switcher
    function setDeviceView(mode) {
      currentViewMode = mode;
      const dWrapper = document.getElementById('desktop-wrapper');
      const mWrapper = document.getElementById('mobile-wrapper');
      
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.remove('bg-brand-500', 'text-white', 'font-semibold');
        b.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`btn-mode-${mode}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-brand-500', 'text-white', 'font-semibold');
        activeBtn.classList.remove('text-slate-400');
      }

      if (mode === 'split') {
        dWrapper.classList.remove('hidden');
        mWrapper.classList.remove('hidden');
      } else if (mode === 'desktop') {
        dWrapper.classList.remove('hidden');
        mWrapper.classList.add('hidden');
      } else if (mode === 'mobile') {
        dWrapper.classList.add('hidden');
        mWrapper.classList.remove('hidden');
      }
    }

    // Switch Page
    function switchPage(pageKey) {
      currentPage = pageKey;
      document.querySelectorAll('.page-tab-btn').forEach(b => {
        b.classList.remove('bg-brand-500', 'text-white', 'font-medium', 'shadow-sm');
        b.classList.add('text-slate-400');
      });
      const targetBtn = document.getElementById(`btn-page-${pageKey}`);
      if (targetBtn) {
        targetBtn.classList.add('bg-brand-500', 'text-white', 'font-medium', 'shadow-sm');
        targetBtn.classList.remove('text-slate-400');
      }

      const pageNames = {
        shelf: '1. 书架主页 (按停留频次全新布局)',
        reader: '2. 沉浸阅读 (2026 双页仿真排版)',
        typography: '3. 实时排版与外观工作台',
        sidebar: '4. 目录大纲与书签抽屉',
        copilot: '5. AI深度伴读副屏 (苏格拉底模式)',
        notes: '6. 笔记与知识沉淀中心',
        discovery: '7. 全网找书与聚合下载引擎',
        search: '8. 全文秒搜面板 (SQLite FTS5)',
        stats: '9. 个人阅读统计与热力图',
        sources: '10. 书源镜像与网络代理配置',
        tts: '11. 听书中心 (黑金声学剧场)',
        hierarchy: '12. 停留频次重构全景架构',
      };
      const indicator = document.getElementById('current-page-indicator');
      if (indicator && pageNames[pageKey]) indicator.innerText = pageNames[pageKey];

      renderCurrentPage();
    }

    // Toggle Prototype Canvas Background
    let darkCanvas = true;
    function toggleCanvasTheme() {
      darkCanvas = !darkCanvas;
      const canvas = document.getElementById('main-canvas');
      if (darkCanvas) {
        canvas.classList.remove('bg-slate-200');
        canvas.classList.add('bg-slate-950');
      } else {
        canvas.classList.remove('bg-slate-950');
        canvas.classList.add('bg-slate-200');
      }
    }

    // =========================================================================
    // RENDER LOGIC FOR ALL 10 PAGES
    // =========================================================================
    function renderCurrentPage() {
      const desktopEl = document.getElementById('desktop-content');
      const mobileEl = document.getElementById('mobile-content');

      if (pageTemplates[currentPage]) {
        desktopEl.innerHTML = pageTemplates[currentPage].desktop;
        mobileEl.innerHTML = pageTemplates[currentPage].mobile;
      }
      lucide.createIcons();
    }

      } else {
        btnRaw.className = 'px-2.5 py-1 rounded-lg bg-amber-900/15 font-bold text-amber-900 shadow-2xs transition-all text-[11px]';
        p1.innerHTML = `本书以我国地方政府投融资为主线，分上下两篇。上篇解释微观机制，包括地方政府的基本事务、收入、支出、土地融资和开发、投资和债务等；下篇解释这些微观行为对宏观现象的影响。`;
      }
    }

    // 5. Page Flip Feedback Animation
    function simulateFlip(dir) {
      const spread = document.querySelector('.book-spine-gutter');
      if (spread) {
        spread.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
        spread.style.opacity = '0.4';
        spread.style.transform = dir === 'next' ? 'translateX(-8px)' : 'translateX(8px)';
        setTimeout(() => {
          spread.style.opacity = '1';
          spread.style.transform = 'translateX(0)';
        }, 160);
      }
    }

    // 6. Typography Studio Live Interactions
    function applyLiveTheme(bg, text) {
      const container = document.getElementById('typography-live-preview');
      if (container) {
        container.style.backgroundColor = bg;
        container.style.color = text;
      }
    }

    function applyLiveFont(fontName, category) {
      const container = document.getElementById('typo-preview-container');
      const label = document.getElementById('typo-label-font');
      if (container) {
        container.style.fontFamily = fontName === '霞鹜文楷' ? '"Noto Serif SC", serif' : (category === 'serif' ? 'serif' : 'sans-serif');
      }
      if (label) label.innerText = fontName;
    }

    function changeLiveFontSize(val) {
      const p1 = document.getElementById('typo-sample-p1');
      const p2 = document.getElementById('typo-sample-p2');
      const sliderVal = document.getElementById('typo-slider-val');
      const label = document.getElementById('typo-label-size');
      if (p1) p1.style.fontSize = `${val}px`;
      if (p2) p2.style.fontSize = `${val}px`;
      if (sliderVal) sliderVal.innerText = `${val} px`;
      if (label) label.innerText = `${val}px`;
    }

    // Initial Render
    renderCurrentPage();
  </script>
</body>
</html>
