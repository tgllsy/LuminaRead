name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  # ------------------------------------------------------------------
  # 桌面三平台：各跑在真实系统 runner 上，无交叉编译
  #   linux   -> x86_64-unknown-linux-musl  (静态链接，零依赖)
  #   windows -> x86_64-pc-windows-msvc     (runner 原生工具链)
  #   macos   -> aarch64-apple-darwin      (Apple Silicon 原生)
  # ------------------------------------------------------------------
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux_amd64
            bin: luminaread
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows_amd64
            bin: luminaread.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin_arm64
            bin: luminaread
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 前端静态资源必须先构建：backend/build.rs 将 ../frontend/dist 内嵌进二进制
      - name: Build Frontend
        shell: bash
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build backend binary
        shell: bash
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }} --bin luminaread

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "luminaread_${env:VERSION}_${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "stage/$pkg" | Out-Null
          Copy-Item "backend/target/${{ matrix.target }}/release/${{ matrix.bin }}" "stage/$pkg/"
          Copy-Item "config.toml" "stage/$pkg/"
          Copy-Item "README.md" "stage/$pkg/"
          Compress-Archive -Path "stage/$pkg" -DestinationPath "stage/$pkg.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force "stage/$pkg"
          Get-ChildItem "stage"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: stage/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Android ARM64：前端 -> Rust cdylib -> Gradle 组装 APK
  # ------------------------------------------------------------------
  build-android:
    name: Android (ARM64 APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Build native library (libluminaread.so)
        working-directory: backend
        run: |
          set -e
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          [ -d "$NDK_PATH" ] || NDK_PATH="$ANDROID_NDK_HOME"
          [ -d "$NDK_PATH" ] || NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          NDK_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"

          # Android 端需要 cdylib 动态库（CI 内临时修改，桌面端仍为 rlib）
          sed -i 's/crate-type = .*/crate-type = ["cdylib", "rlib"]/' Cargo.toml
          cargo build --lib --target aarch64-linux-android --release

          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libluminaread.so \
             ../android/app/src/main/jniLibs/arm64-v8a/libluminaread.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Assemble APK
        working-directory: android
        run: |
          set -e
          # 优先使用 setup-gradle provisioned 的 Gradle 8.5，防止被 runner 系统环境中的 Gradle 9.x 劫持
          GRADLE_BIN="$(find /home/runner/work/_temp/ "${RUNNER_TEMP:-/tmp}" -path "*/gradle-8.5/bin/gradle" 2>/dev/null | head -n 1)"
          if [ ! -x "$GRADLE_BIN" ]; then
            GRADLE_BIN="$(find /home/runner /opt /usr -path "*/gradle-8.5*/bin/gradle" 2>/dev/null | head -n 1)"
          fi
          if [ ! -x "$GRADLE_BIN" ]; then
            GRADLE_BIN="${GRADLE_HOME:+$GRADLE_HOME/bin/gradle}"
          fi
          if [ ! -x "$GRADLE_BIN" ]; then
            GRADLE_BIN="$(command -v gradle)"
          fi
          echo "Using gradle: $GRADLE_BIN"
          "$GRADLE_BIN" --version
          "$GRADLE_BIN" assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "luminaread_${VERSION}_android.apk"
          ls -lh "luminaread_${VERSION}_android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-android_apk
          path: luminaread_*_android.apk
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 汇总发布：收集全部 artifact -> 校验和 -> GitHub Release
  # ------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build-desktop, build-android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: rel

      - name: Generate checksums
        run: |
          cd rel
          sha256sum *.zip *.apk > checksums.txt
          cat checksums.txt
          ls -lh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # 覆盖式发布：同名 Release 已存在则先删（保留 tag）
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release delete "$VERSION" --yes
          fi

          cat > notes.md <<EOF
          LuminaRead ${VERSION} 全平台发布版。单文件零依赖：前端资源与 SQLite 静态内嵌，解压后直接运行。

          ### 平台产物
          - Android (ARM64 APK): luminaread_${VERSION}_android.apk
          - Linux (x86_64 静态 MUSL): luminaread_${VERSION}_linux_amd64.zip
          - Windows (x86_64 MSVC): luminaread_${VERSION}_windows_amd64.zip
          - macOS (Apple Silicon arm64): luminaread_${VERSION}_darwin_arm64.zip

          ### 校验
          各资产 SHA-256 见 checksums.txt。
          EOF

          gh release create "$VERSION" rel/* \
            --title "LuminaRead $VERSION" \
            --notes-file notes.md
