[package]
name = "luminaread"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "LuminaRead (阅境) - 单文件部署的本地多端 Web 读书系统"

[lib]
name = "luminaread"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "luminaread"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "signal", "process", "sync"] }
tower-http = { version = "0.5", default-features = false, features = ["cors", "compression-gzip", "trace"] }
tower = { version = "0.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
async-trait = "0.1"
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "socks", "json"] }


[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "symbols"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

